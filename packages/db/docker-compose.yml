name: plearn-dev

services:
    plearn-db:
        image: pgvector/pgvector:pg17
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: plearn_dev
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - plearn_dev_pgdata:/var/lib/postgresql

volumes:
    plearn_dev_pgdata:
